server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/digital-documents/import-xlsx {
        client_max_body_size 11m; # 10 MB workbook plus multipart headers.
        proxy_read_timeout 120s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/digital-documents/import-report-xlsx {
        client_max_body_size 110m; # JSON report from a workbook bounded to 100 MB uncompressed.
        proxy_read_timeout 120s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/(devices/[0-9]+|warehouse/items/[0-9]+)/photos/?$ {
        client_max_body_size 101m; # Up to 10 photos of 10 MB plus multipart headers.
        proxy_read_timeout 120s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
